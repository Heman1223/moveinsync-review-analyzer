# Light and dark themes. The app follows the viewer's system setting by default;
# anyone can switch manually via the ⋮ menu → Settings → Theme.
# Page background is softly tinted so white cards stand out (see the CSS in app.py).

[theme]
baseRadius = "medium"
showWidgetBorder = true
font = "Inter, sans-serif"
headingFont = "Inter, sans-serif"

[theme.light]
primaryColor = "#2563EB"
backgroundColor = "#F2F5FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1E293B"
borderColor = "#E2E8F0"
linkColor = "#1D4ED8"

[theme.dark]
primaryColor = "#60A5FA"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#131C2E"
textColor = "#E2E8F0"
borderColor = "#24324A"
linkColor = "#93C5FD"

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
